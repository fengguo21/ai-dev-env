name: Workspace checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew list tmux >/dev/null 2>&1 || brew install tmux
      - name: Check Shell syntax and whitespace
        run: |
          for script in dev newtask task doctor install.sh uninstall.sh lib/common.sh; do
            bash -n "$script" || exit
          done
          git diff --check
      - name: Run isolated regressions
        run: python3 -m unittest discover -s tests -v
