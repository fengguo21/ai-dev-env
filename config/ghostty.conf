# AI Dev Environment v1.1 — Ghostty
# A low-distraction Tokyo Night setup for long AI coding sessions.

# Typography
# "Mono" keeps Nerd Font symbols strictly single-cell in terminal layouts.
font-family = JetBrainsMono Nerd Font Mono
font-size = 15

# Keep operators literal in diffs, logs, and shell commands (for example !=).
font-feature = -calt

# Theme and readability
theme = TokyoNight Night
window-theme = dark
background-opacity = 1
background-blur = false
minimum-contrast = 1.1

# Retain long non-tmux command output without using unbounded memory.
scrollback-limit = 50000000

# Balanced breathing room without sacrificing too much terminal space.
window-padding-x = 10
window-padding-y = 8
window-padding-balance = true
window-padding-color = background

# Keep native Ghostty splits visually consistent with the tmux palette.
unfocused-split-opacity = 0.92
unfocused-split-fill = #1a1b26
split-divider-color = #414868

# A stable cursor is easier to track in busy Codex and Claude Code output.
cursor-style = block
cursor-style-blink = false

# macOS interaction
copy-on-select = clipboard
clipboard-read = ask
clipboard-write = allow
clipboard-paste-protection = true
shell-integration = detect

# Preserve prompt navigation and install Ghostty terminfo on SSH hosts when
# possible, so true color keeps working beyond the local machine.
shell-integration-features = cursor,no-sudo,title,ssh-env,ssh-terminfo,path

# Confirm only when Ghostty detects a running process in the surface.
confirm-close-surface = true

# Left Option works as Alt for shell/tmux shortcuts; right Option remains native.
macos-option-as-alt = left

# A compact native tab bar matches the dark terminal surface on macOS.
macos-titlebar-style = tabs
