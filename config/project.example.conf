# Copy to <project>/.ai-dev.conf. Literal key=value, NOT a shell script.
# Do not quote values or use export. Full-line comments only.
# dev --plan previews; dev --check checks; dev --start runs commands.
# Original six-window layout and deep model selection are the defaults.
# All launcher-managed Codex panes bypass approvals and the Codex sandbox.
# Alternatives: layout=focus|pair|full, profile=standard.
layout=classic
profile=deep

# Directories are relative to this worktree. Empty values enable auto-detection.
backend_dir=backend
frontend_dir=frontend
backend_cmd=uv run uvicorn app.main:app --reload --host 127.0.0.1 --port "$BACKEND_PORT"
frontend_cmd=pnpm dev --host 127.0.0.1 --port "$FRONTEND_PORT"
test_cmd=git diff --check
services_cmd=docker compose up

# Empty ports are derived from the absolute worktree path. Override conflicts.
# Applications must use these variables/flags; the launcher cannot rewrite apps.
backend_port=
frontend_port=

# deep (default) selects by visible catalog priority, using the highest supported
# reasoning effort and Fast when supported; multi_agent is enabled.
# standard respects CLI model/effort defaults. Both profiles bypass permissions.
# Optional explicit overrides, capability support depends on your installed CLI.
codex_model=
codex_effort=
codex_fast=auto

# Optional exact IDs for dev --resume. Empty opens the CLI's history picker.
# Keep personal session IDs in your local untracked configuration.
codex_session=
claude_session=
