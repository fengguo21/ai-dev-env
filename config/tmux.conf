# AI Dev Environment v1.1 — tmux
# Tokyo Night, tuned for Codex / Claude Code / FastAPI / Vue / Docker workflows.

##### Prefix and responsiveness ############################################

unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -s escape-time 10
set -g repeat-time 600

##### Terminal capabilities ################################################

# Advertise tmux inside panes while describing the real outer terminal below.
set -g default-terminal "tmux-256color"

# Native tmux 3.2+ declarations for Ghostty and compatible fallbacks.
set -as terminal-features ",xterm-ghostty:RGB,clipboard,focus,title,extkeys"
set -as terminal-features ",xterm-256color:RGB"

# Compatibility fallback for older applications that still look for Tc.
set -as terminal-overrides ",xterm-ghostty:Tc"
set -as terminal-overrides ",xterm-256color:Tc"

set -g focus-events on
set -g set-clipboard on
set -s extended-keys on

##### Sessions, windows, and history #######################################

set -g mouse on
set -g history-limit 200000

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Keep workflow names such as codex/backend/frontend/docker stable.
set -g allow-rename off
setw -g automatic-rename off

set -g display-time 1500
set -g status-interval 5
set -g status-justify left

##### Windows and panes #####################################################

# New windows and splits inherit the active pane's project/worktree directory.
bind c new-window -c "#{pane_current_path}"

unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style navigation. Uppercase bindings repeat while held for resizing.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload the installed configuration without restarting sessions.
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

##### Copy mode #############################################################

setw -g mode-keys vi
set -g status-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Mouse dragging copies directly through tmux's clipboard integration.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

##### Tokyo Night visual system ############################################

# Palette reference:
# bg       #1a1b26   surface  #16161e   border   #292e42
# text     #c0caf5   muted    #565f89   blue     #7aa2f7
# cyan     #7dcfff   yellow   #e0af68   red      #f7768e

set -g status-position bottom
set -g status-style "bg=#16161e,fg=#a9b1d6"
set -g status-left-length 40
set -g status-right-length 80

# Session at left; prefix indicator, date, and time at right.
set -g status-left "#[fg=#15161e,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#16161e,nobold] "
set -g status-right "#[fg=#e0af68,bold]#{?client_prefix,PREFIX ,}#[fg=#565f89,nobold]%Y-%m-%d #[fg=#7dcfff]%H:%M "

setw -g window-status-separator ""
setw -g window-status-format " #I:#W#F "
setw -g window-status-current-format " #I:#W#F "
setw -g window-status-style "fg=#565f89,bg=#16161e"
setw -g window-status-current-style "fg=#15161e,bg=#7aa2f7,bold"
setw -g window-status-activity-style "fg=#e0af68,bg=#16161e,bold"

set -g pane-border-lines simple
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g display-panes-colour "#565f89"
set -g display-panes-active-colour "#7aa2f7"

set -g message-style "fg=#c0caf5,bg=#292e42"
set -g message-command-style "fg=#7dcfff,bg=#292e42"
setw -g mode-style "fg=#c0caf5,bg=#364a82"
setw -g clock-mode-colour "#7aa2f7"

setw -g monitor-activity on
set -g visual-activity off

##### Plugins ###############################################################

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# TPM stays last. The guard lets a fresh install validate this file before
# the plugin manager has been cloned.
run-shell -b 'if [ -x "$HOME/.tmux/plugins/tpm/tpm" ]; then "$HOME/.tmux/plugins/tpm/tpm"; fi'
